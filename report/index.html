/* 화면 고르기: #/login · #/write · #/hub · #/view · #/sched · #/admin */
(function () {
  var pages = { login: 'login', write: 'write', hub: 'hub', view: 'view', sched: 'sched', admin: 'admin' };
  var name = pages[KR.route.name] ? KR.route.name : 'login', REV = '20261112g';   // 화면 스크립트가 바뀌면 올림(브라우저에 남은 예전 파일을 쓰지 않게)
  document.body.className = 'pg-' + name + (name === 'login' || name === 'view' ? ' dark' : '');
  window.addEventListener('hashchange', function () { location.reload(); });
  var s = document.createElement('script');
  s.src = 'assets/' + pages[name] + '.js?v=' + REV;
  document.body.appendChild(s);
})();
